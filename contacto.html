<!doctype HTML>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<title> PixelNorte - Contacto</title>
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<header id="site-header">
	<h1> PixelNorte</h1>
	
      <nav id="nav-principal">
	<ul>
	<li><a href="index.html">Inicio</a></li>
	<li><a href="servicios.html">Servicios</a></li>
	<li><a href="contacto.html">Contacto</a></li>
	</ul>
      </nav>
</header>
	<main>
	<section id="contacto">
		<h2>Contactanos</h2>
		<p>Envianos tu mensaje</p>
			<form id="formulario-contacto" action="#" method="post">
 	
		<label for="nombre">Nombre:</label>
		<input type="text" id="nombre" name="nombre" required>
		
		<label for="email">Correo Electronico:</label>
		<input type="email" id="email" name="email" required>

		<label for="telefono"> Telefono:</label>
		<input type="tel" id="telefono" name="telefono">

		<label for="servicio">Servicios:</label>
		<select id="servicio" name="servicio">
			<option value="diseño-web"> Diseño web personalizado</option>
			<option value="desarrollo-web"> Desarrollo web</option>
			<option value="mantenimiento"> Mantenimiento</option>
			<option value="tienda-online">Tienda Online</option>
		</select>

	<fieldset class="campo-ancho">
		<legend>¿Cómo Preferis que te contactemos? </legend>
		<input type="checkbox" id="contacto-email" name="medio-contacto" value="email">
		<label for="contacto-email">Email</label>

		<input type="checkbox" id="contacto-telefono" name="medio-contacto" value="telefono">
		<label for="contacto-telefono">Telefono</label> 

		<input type="checkbox" id="contacto-whatsapp" name="medio-contacto" value="whatsapp">
		<label for="contacto-whatsapp">Whatsapp</label>
	</fieldset>
		<label for="mensaje" class="campo-ancho"> Dejanos tu comentario</label>
		<textarea id="mensaje" name="mensaje" rows="5" class="campo-ancho"></textarea>
	
		<button type="submit" class="campo-ancho">Enviar Fornulario</button>
	</form>
     </section>
   </main>
	<footer id="site-footer">					
	<p> PixelNorte</p>
	</footer>
</body>
</html>
